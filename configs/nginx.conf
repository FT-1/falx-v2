# =============================================================================
# Project: FALX V2
# Lead Architect & Owner: FT-1
# Description: Nginx reverse proxy (configs/nginx.conf).
#              Fronts the SOC backend with TLS termination, rate limiting,
#              and WebSocket upgrade support.
#              Install: sudo cp configs/nginx.conf /etc/nginx/sites-available/falx
#                       sudo ln -s /etc/nginx/sites-available/falx /etc/nginx/sites-enabled/
#                       sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=falx_login:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=falx_api:10m     rate=300r/m;
limit_req_zone $binary_remote_addr zone=falx_ws:10m      rate=5r/m;

# ─── Upstream ─────────────────────────────────────────────────────────────────
upstream falx_soc_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ─── HTTP → HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name soc.falx.local;
    return 301 https://$server_name$request_uri;
}

# ─── HTTPS Server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name soc.falx.local;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/falx/tls/server.crt;
    ssl_certificate_key /etc/falx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"  always;
    add_header X-Frame-Options           "DENY"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Hide server info
    server_tokens off;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ── Auth endpoints (strict rate limiting) ──────────────────────────────
    location /api/v1/auth/login {
        limit_req zone=falx_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://falx_soc_backend;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/auth/refresh {
        limit_req zone=falx_api burst=20 nodelay;
        proxy_pass http://falx_soc_backend;
        include /etc/nginx/proxy_params;
    }

    # ── WebSocket (real-time events) ────────────────────────────────────────
    location /ws {
        limit_req zone=falx_ws burst=3 nodelay;

        proxy_pass http://falx_soc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── API endpoints ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=falx_api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://falx_soc_backend;
        include /etc/nginx/proxy_params;

        # Block suspicious request methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }
    }

    # ── Health / Metrics (no rate limit, internal only) ─────────────────────
    location /healthz {
        proxy_pass http://falx_soc_backend;
        access_log off;
    }

    location /readyz {
        proxy_pass http://falx_soc_backend;
        access_log off;
    }

    location /metrics {
        # Prometheus scrape endpoint — restrict to monitoring network
        allow 10.0.0.0/8;
        allow 127.0.0.0/8;
        deny  all;
        proxy_pass http://127.0.0.1:9090;
    }

    # ── Dashboard SPA (catch-all) ────────────────────────────────────────────
    location / {
        proxy_pass http://falx_soc_backend;
        include /etc/nginx/proxy_params;

        # SPA: serve index.html for all unknown paths
        proxy_intercept_errors on;
        error_page 404 = /;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/falx_access.log combined;
    error_log  /var/log/nginx/falx_error.log  warn;
}
