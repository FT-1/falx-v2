# =============================================================================
# Project: FALX V2
# Lead Architect & Owner: FT-1
# Description: Rust workspace root - manages ebpf-kern and ebpf-user crates
#              as a unified workspace for shared dependency management.
# =============================================================================

[workspace]
resolver = "2"
members  = [
    "ebpf-kern",
    "ebpf-user",
]
# Scope root-level `cargo build` / `cargo check` to ebpf-user only.
# ebpf-kern is no_std + no_main and only builds for `--target bpfel-unknown-none`;
# building it for the host triple fails with `undefined symbol: main`. The kernel
# crate is still produced — ebpf-user/build.rs cross-compiles it during the
# user-space build — so excluding it from default-members costs nothing.
# To build the kernel crate explicitly:
#     cargo build -p falx-kern --target bpfel-unknown-none -Z build-std=core
default-members = ["ebpf-user"]

# ─── Shared dependency versions (workspace-level) ────────────────────────────
[workspace.dependencies]
aya             = { version = "0.13",  features = ["async_tokio"] }
aya-log         = { version = "0.2"  }
aya-ebpf        = { version = "0.1"  }
aya-log-ebpf    = { version = "0.1"  }
tokio           = { version = "1.38", features = ["full"] }
anyhow          = { version = "1.0"  }
thiserror       = { version = "1.0"  }
log             = { version = "0.4"  }
env_logger      = { version = "0.11" }
clap            = { version = "4.5",  features = ["derive"] }
serde           = { version = "1.0",  features = ["derive"] }
serde_json      = { version = "1.0"  }
toml            = { version = "0.8"  }
bytes           = { version = "1.6"  }
libc            = { version = "0.2"  }

[workspace.metadata.falx]
version         = "0.1.0"
architect       = "FT-1"
project         = "FALX V2"

# ─── Build Profiles (workspace-level — required by Cargo) ────────────────────
# Cargo emits a warning when profiles are defined inside a member crate:
#   "profiles for the non root package will be ignored, specify profiles at
#    the workspace root"
# Moving them here silences the warning AND ensures the same profile applies
# to all workspace members (ebpf-kern, ebpf-user).
# panic = "abort" is REQUIRED for the BPF target — there is no unwinder in BPF.
[profile.release]
opt-level     = 3
lto           = true
panic         = "abort"
codegen-units = 1
# IMPORTANT: do NOT set `strip = true` here. For the BPF target, stripping
# can remove the .BTF section that the kernel verifier needs for type-aware
# error messages and that aya-log relies on. `debug = false` (the default
# for release) is fine; explicit stripping is not.

[profile.dev]
panic         = "abort"
opt-level     = 0
