# =============================================================================
# Project: FALX V2
# Lead Architect & Owner: FT-1
# Description: Rust workspace root - manages ebpf-kern and ebpf-user crates
#              as a unified workspace for shared dependency management.
# =============================================================================

[workspace]
resolver = "2"
members  = [
    "ebpf-kern",
    "ebpf-user",
]

# ─── Shared dependency versions (workspace-level) ────────────────────────────
[workspace.dependencies]
aya             = { version = "0.13",  features = ["async_tokio"] }
aya-log         = { version = "0.2"  }
aya-ebpf        = { version = "0.1"  }
aya-log-ebpf    = { version = "0.1"  }
tokio           = { version = "1.38", features = ["full"] }
anyhow          = { version = "1.0"  }
thiserror       = { version = "1.0"  }
log             = { version = "0.4"  }
env_logger      = { version = "0.11" }
clap            = { version = "4.5",  features = ["derive"] }
serde           = { version = "1.0",  features = ["derive"] }
serde_json      = { version = "1.0"  }
toml            = { version = "0.8"  }
bytes           = { version = "1.6"  }
libc            = { version = "0.2"  }

[workspace.metadata.falx]
version         = "0.1.0"
architect       = "FT-1"
project         = "FALX V2"
