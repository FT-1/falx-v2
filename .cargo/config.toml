# =============================================================================
# Project: FALX V2
# Lead Architect & Owner: FT-1
# Description: Cargo workspace-level config (.cargo/config.toml).
#              Sets default build targets and linker flags for BPF compilation.
# =============================================================================

[build]
# Default target for workspace (host arch for user-space crates)
# ebpf-kern overrides this via: cargo build --target bpfel-unknown-none

[target.bpfel-unknown-none]
# bpf-linker is required to produce valid BPF ELF objects from Rust.
# Install: cargo install bpf-linker
linker = "bpf-linker"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=--disable-memory-builtins",
    # Force generic CPU for BPF — otherwise the host's target-cpu (e.g.
    # alderlake on Intel 12th gen+) leaks through and bpf-linker rejects it
    # with: "invalid value 'alderlake' for '--cpu <CPU>'".
    "-C", "target-cpu=generic",
    # --keep-btf was removed in bpf-linker >= 0.9; BTF preservation is now the
    # default and the flag is rejected as an unknown argument. Do NOT re-add it.
]

# NOTE: We DELIBERATELY do NOT set [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=native"] here. While it would give a small
# performance boost for the user-space crates, on modern CPUs (alderlake+)
# it also generates target-features that LLVM ignores during BPF
# cross-compilation and emits dozens of warnings. Operators who want
# `target-cpu=native` for the host build should set:
#     RUSTFLAGS="-C target-cpu=native" cargo build --release
# on a per-invocation basis, NOT in this config.

# NOTE: We DELIBERATELY do NOT enable `[unstable] build-std = ["core"]` here.
# The flag applies GLOBALLY to every target, which makes cargo build a fresh
# `core` for the host x86_64-unknown-linux-gnu build — which then collides
# with the nightly toolchain's pre-built std (causing "duplicate lang item
# in crate core: sized"). The BPF build passes `-Z build-std=core` on the
# command line (Makefile + ebpf-user/build.rs), so the BPF target gets
# build-std without polluting host builds.
