# Description: Prometheus scrape config (docker/prometheus.yml).
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project:   'falx-v2'
    architect: 'FT-1'

scrape_configs:
  - job_name: 'falxd'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'falx-soc'
    static_configs:
      - targets: ['falx-soc:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
